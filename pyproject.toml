[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jeevacation"
version = "2.0.0"
description = "Enhanced LinkedIn contact search tool for Epstein court documents with web interface, AI analysis, and monitoring"
authors = [{name = "Montana", email = ""}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "plotly>=5.18.0",
    "networkx>=3.2.0",
    "PyPDF2>=3.0.0",
    "pdf2image>=1.16.3",
    "Pillow>=10.1.0",
    "openai>=1.3.0",
    "anthropic>=0.7.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "apscheduler>=3.10.0",
    "sendgrid>=6.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
]

[project.scripts]
epstein-cli = "jeevacation.cli:main"
epstein-web = "jeevacation.web.app:main"
epstein-monitor = "jeevacation.monitor:main"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
